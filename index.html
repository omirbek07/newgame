<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shinobi Chronicles: Visual Edition</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel-bg: rgba(22, 27, 34, 0.95);
      --accent: #f39c12;
      --text: #f0f6fc;
      --subtext: #8b949e;
      --danger: #f85149;
      --success: #2ea043;
      --blue: #58a6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #010409; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: var(--text); }
    
    #app-container {
      width: 100%; max-width: 420px; height: 100vh; max-height: 860px;
      background: var(--bg); display: flex; flex-direction: column;
      border: 1px solid #30363d; border-radius: 14px; overflow: hidden; position: relative;
    }

    /* СЦЕНА С ФОНОМ И СПРАЙТАМИ */
    #visual-stage {
      height: 52%; width: 100%; position: relative;
      background-size: cover; background-position: center;
      display: flex; justify-content: center; align-items: flex-end;
      overflow: hidden; border-bottom: 2px solid #30363d;
      transition: background-image 0.4s ease;
    }

    #char-sprite {
      max-height: 92%; max-width: 80%; object-fit: contain;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,0.7));
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    /* ЭФФЕКТЫ ТРЯСКИ И УРОНА */
    .shake { animation: shakeAnim 0.3s ease-in-out; }
    @keyframes shakeAnim {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-8px, 4px); }
      50% { transform: translate(8px, -4px); }
      75% { transform: translate(-4px, 2px); }
    }
    .hit-flash { filter: brightness(2.5) drop-shadow(0 0 10px red) !important; }

    /* НИЖНЯЯ ПАНЕЛЬ ДИАЛОГОВ / ДЕЙСТВИЙ */
    #control-panel {
      height: 48%; display: flex; flex-direction: column;
      padding: 12px; background: var(--panel-bg); gap: 8px; overflow-y: auto;
    }

    .speaker-name {
      font-size: 13px; font-weight: bold; color: var(--accent);
      text-transform: uppercase; letter-spacing: 1px;
    }
    .dialogue-text { font-size: 13.5px; line-height: 1.45; color: var(--text); flex-grow: 1; }

    .choice-btn {
      width: 100%; padding: 10px 12px; background: #21262d; border: 1px solid #30363d;
      border-radius: 8px; color: var(--text); text-align: left; font-size: 12.5px;
      cursor: pointer; transition: 0.15s;
    }
    .choice-btn:active { background: #30363d; border-color: var(--accent); }

    .primary-btn {
      width: 100%; padding: 11px; background: var(--accent); border: none;
      border-radius: 8px; color: #0d1117; font-size: 13.5px; font-weight: bold; cursor: pointer;
    }

    /* БОЕВЫЕ ЭЛЕМЕНТЫ */
    .hp-bar-bg { width: 100%; background: #21262d; height: 7px; border-radius: 4px; overflow: hidden; margin-top: 3px; }
    .hp-bar-fill { height: 100%; background: var(--success); transition: width 0.3s ease; }
    .battle-hud { position: absolute; top: 10px; width: 92%; display: flex; justify-content: space-between; gap: 10px; z-index: 10; }
    .hud-box { background: rgba(13, 17, 23, 0.85); backdrop-filter: blur(4px); padding: 6px 10px; border-radius: 6px; border: 1px solid #30363d; flex: 1; font-size: 11px; }
    .combat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  </style>
</head>
<body>

<div id="app-container">
  <!-- ВЕРХНЯЯ ВИЗУАЛЬНАЯ СЦЕНА -->
  <div id="visual-stage">
    <div class="battle-hud" id="battle-hud" style="display:none;">
      <div class="hud-box">
        <span id="player-hud-name">Шиноби</span>
        <div class="hp-bar-bg"><div class="hp-bar-fill" id="p-hp-bar"></div></div>
      </div>
      <div class="hud-box" style="text-align:right;">
        <span id="enemy-hud-name" style="color:var(--danger);">Отступник</span>
        <div class="hp-bar-bg"><div class="hp-bar-fill" id="e-hp-bar" style="background:var(--danger); float:right;"></div></div>
      </div>
    </div>
    <img id="char-sprite" src="" alt="character" style="display:none;">
  </div>

  <!-- НИЖНЯЯ ПАНЕЛЬ ИГРЫ -->
  <div id="control-panel"></div>
</div>

<script>
// --- АССЕТЫ ВИЗУАЛА (ФОНЫ И СПРАЙТЫ) ---
const ASSETS = {
  bg: {
    academy: "https://images.unsplash.com/photo-1580582932707-520aed937b7b?auto=format&fit=crop&w=800&q=80",
    konoha: "https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=800&q=80",
    forest: "https://images.unsplash.com/photo-1511497584788-87676104235f?auto=format&fit=crop&w=800&q=80"
  },
  sprites: {
    iruka: "https://api.dicebear.com/7.x/bottts/svg?seed=iruka", // заполнители
    naruto: "https://api.dicebear.com/7.x/adventurer/svg?seed=Naruto&hair=short02&hairColor=f1c40f",
    sasuke: "https://api.dicebear.com/7.x/adventurer/svg?seed=Sasuke&hair=short01&hairColor=2c3e50",
    hinata: "https://api.dicebear.com/7.x/adventurer/svg?seed=Hinata&hair=long01&hairColor=34495e",
    enemy: "https://api.dicebear.com/7.x/bottts/svg?seed=rogueNinja"
  }
};

const state = {
  name: "Рэн",
  clan: "uzumaki",
  element: "fire",
  elementNames: { fire: "Огонь", wind: "Ветер", lightning: "Молния", earth: "Земля", water: "Вода" },
  stats: { taijutsu: 4, ninjutsu: 4, chakraControl: 5 },
  relations: { naruto: 10, sasuke: 5, hinata: 15 },
  selectedPartner: "naruto",
  ryo: 500
};

let combat = null;

const stage = document.getElementById("visual-stage");
const sprite = document.getElementById("char-sprite");
const panel = document.getElementById("control-panel");
const battleHud = document.getElementById("battle-hud");

function setScene(bgUrl, spriteUrl = null) {
  stage.style.backgroundImage = `url('${bgUrl}')`;
  if (spriteUrl) {
    sprite.src = spriteUrl;
    sprite.style.display = "block";
  } else {
    sprite.style.display = "none";
  }
}

// 1. СЦЕНА ВРУЧЕНИЯ ПРОТЕКТОРА
function scenePrologue() {
  battleHud.style.display = "none";
  setScene(ASSETS.bg.academy, ASSETS.sprites.naruto);

  panel.innerHTML = `
    <div class="speaker-name">Ирука Умино</div>
    <div class="dialogue-text">
      «Поздравляю, ${state.name}! Ты сдал выпускной тест Академии. С этого дня ты шиноби Деревни Скрытого Листа. Сделай свой выбор: к кому ты подойдешь в коридоре?»
    </div>
    <button class="choice-btn" onclick="talkNaruto()">🍜 Подойти к Наруто</button>
    <button class="choice-btn" onclick="talkSasuke()">⚡ Подойти к Саске</button>
    <button class="choice-btn" onclick="talkHinata()">🌸 Подойти к Хинате</button>
  `;
}

function talkNaruto() {
  setScene(ASSETS.bg.academy, ASSETS.sprites.naruto);
  panel.innerHTML = `
    <div class="speaker-name">Наруто Узумаки</div>
    <div class="dialogue-text">
      «Видал мой протектор?! Мы теперь настоящие ниндзя! Спорим, я стану Хокаге быстрее всех вас?!»
    </div>
    <button class="choice-btn" onclick="state.relations.naruto+=10; sceneKonohaHub();">
      «Я верю в тебя, Наруто! Покажем всем класс!» (+10 дружбы)
    </button>
  `;
}

function talkSasuke() {
  setScene(ASSETS.bg.academy, ASSETS.sprites.sasuke);
  panel.innerHTML = `
    <div class="speaker-name">Саске Учиха</div>
    <div class="dialogue-text">
      «Повязка на лбу еще никого не сделала сильным. Настоящий отбор начнется на первой же миссии.»
    </div>
    <button class="choice-btn" onclick="state.relations.sasuke+=10; sceneKonohaHub();">
      «Посмотрим в первом же спарринге, Саске.» (+10 соперничества)
    </button>
  `;
}

function talkHinata() {
  setScene(ASSETS.bg.academy, ASSETS.sprites.hinata);
  panel.innerHTML = `
    <div class="speaker-name">Хината Хьюга</div>
    <div class="dialogue-text">
      «А... эм... ${state.name}... Поздравляю с выпуском... Твой контроль чакры был очень впечатляющим...»
    </div>
    <button class="choice-btn" onclick="state.relations.hinata+=15; sceneKonohaHub();">
      «Спасибо, Хината! Твой стиль тоже прекрасен.» (+15 симпатии)
    </button>
  `;
}

// 2. ХАБ КОНОХИ
function sceneKonohaHub() {
  battleHud.style.display = "none";
  setScene(ASSETS.bg.konoha, null);

  panel.innerHTML = `
    <div class="speaker-name">Главные ворота Конохи</div>
    <div class="dialogue-text">
      Ты на улицах Деревни Листа. В кармане <b>${state.ryo} Рё</b>.<br>
      Связь: 🍜 Наруто (${state.relations.naruto}) | ⚡ Саске (${state.relations.sasuke}) | 🌸 Хината (${state.relations.hinata})
    </div>

    <div style="font-size:11px; color:var(--subtext); margin-bottom:4px;">Выбери напарника:</div>
    <div style="display:flex; gap:6px;">
      <button class="choice-btn" style="text-align:center;" onclick="state.selectedPartner='naruto'; alert('Напарник: Наруто');">Наруто</button>
      <button class="choice-btn" style="text-align:center;" onclick="state.selectedPartner='sasuke'; alert('Напарник: Саске');">Саске</button>
      <button class="choice-btn" style="text-align:center;" onclick="state.selectedPartner='hinata'; alert('Напарник: Хината');">Хината</button>
    </div>

    <button class="primary-btn" style="margin-top:auto;" onclick="startCombatScene()">
      ⚔️ Выйти на миссию ранга C (Засада в лесу) →
    </button>
  `;
}

// 3. БОЕВАЯ ВИЗУАЛЬНАЯ СЦЕНА
function startCombatScene() {
  combat = {
    turn: 1,
    pHp: 75, pMaxHp: 75,
    pChakra: 70, pMaxChakra: 70,
    ap: 3,
    eHp: 65, eMaxHp: 65,
    kawarimi: false
  };

  battleHud.style.display = "flex";
  document.getElementById("player-hud-name").innerText = state.name;
  setScene(ASSETS.bg.forest, ASSETS.sprites.enemy);
  renderCombatTurn();
}

function updateHudBars() {
  const pPct = Math.max(0, Math.round((combat.pHp / combat.pMaxHp) * 100));
  const ePct = Math.max(0, Math.round((combat.eHp / combat.eMaxHp) * 100));
  document.getElementById("p-hp-bar").style.width = pPct + "%";
  document.getElementById("e-hp-bar").style.width = ePct + "%";
}

function triggerHitAnimation() {
  sprite.classList.add("shake", "hit-flash");
  stage.classList.add("shake");
  setTimeout(() => {
    sprite.classList.remove("shake", "hit-flash");
    stage.classList.remove("shake");
  }, 350);
}

function renderCombatTurn(message = "Твой черед действовать! Выбери тактику:") {
  updateHudBars();
  panel.innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span class="speaker-name">Раунд ${combat.turn}</span>
      <span style="font-size:12px; font-weight:bold; color:var(--accent);">⚡ ОД: ${combat.ap} | 🌀 Чакра: ${combat.pChakra}</span>
    </div>
    <div class="dialogue-text" style="font-size:12px; margin: 4px 0;">${message}</div>

    <div class="combat-grid">
      <button class="choice-btn" onclick="combatAttack()" ${combat.ap < 1 ? 'disabled':''}>
        🗡️ Бросок куная<br><small>1 ОД (+8 чакры)</small>
      </button>

      <button class="choice-btn" onclick="combatJutsu()" ${combat.ap < 2 || combat.pChakra < 25 ? 'disabled':''}>
        🔥 Стихия: ${state.elementNames[state.element]}<br><small>2 ОД (25 чакры)</small>
      </button>

      <button class="choice-btn" onclick="combatKawarimi()" ${combat.ap < 1 || combat.kawarimi ? 'disabled':''}>
        🪵 Замещение<br><small>1 ОД (Щит 80%)</small>
      </button>

      <button class="choice-btn" onclick="combatPartner()" ${combat.ap < 2 ? 'disabled':''}>
        👥 Удар напарника<br><small>2 ОД [${state.selectedPartner.toUpperCase()}]</small>
      </button>
    </div>

    <button class="choice-btn" style="text-align:center; background:#161b22; margin-top:2px;" onclick="enemyTurn()">
      ⌛ Завершить ход
    </button>
  `;
}

function combatAttack() {
  combat.ap -= 1;
  const dmg = 12;
  combat.eHp -= dmg;
  combat.pChakra = Math.min(combat.pMaxChakra, combat.pChakra + 8);
  triggerHitAnimation();
  checkBattle("🗡️ Ты метнул кунай прямо в цель: -" + dmg + " HP врагу!");
}

function combatJutsu() {
  combat.ap -= 2;
  combat.pChakra -= 25;
  const dmg = 24;
  combat.eHp -= dmg;
  triggerHitAnimation();
  checkBattle("✨ Мощная стихийная техника сокрушает оборону: -" + dmg + " HP!");
}

function combatKawarimi() {
  combat.ap -= 1;
  combat.kawarimi = true;
  renderCombatTurn("🪵 Техника замещения активирована. Ты готов к контратаке.");
}

function combatPartner() {
  combat.ap -= 2;
  const dmg = 18;
  combat.eHp -= dmg;
  triggerHitAnimation();
  checkBattle(`👥 Твой напарник ${state.selectedPartner.toUpperCase()} внезапно атаковал с фланга: -${dmg} HP!`);
}

function enemyTurn() {
  let dmg = 16;
  let log = "";
  if (combat.kawarimi) {
    dmg = 3;
    combat.kawarimi = false;
    log = "🪵 Враг рассек бревно подмены! Ты получил всего 3 урона.";
  } else {
    log = `💥 Отступник ударил ветряным лезвием: -${dmg} HP!`;
  }

  stage.classList.add("shake");
  setTimeout(() => stage.classList.remove("shake"), 300);

  combat.pHp -= dmg;
  combat.turn++;
  combat.ap = 3;

  if (combat.pHp <= 0) {
    battleHud.style.display = "none";
    panel.innerHTML = `
      <div class="speaker-name" style="color:var(--danger);">Поражение</div>
      <div class="dialogue-text">Ты потерял сознание от полученных ран. Напарник успел вытащить тебя из боя.</div>
      <button class="primary-btn" onclick="sceneKonohaHub()">Очнуться в палате Конохи</button>
    `;
    return;
  }

  renderCombatTurn(log);
}

function checkBattle(lastActionLog) {
  if (combat.eHp <= 0) {
    battleHud.style.display = "none";
    sprite.style.display = "none";
    state.ryo += 1000;
    panel.innerHTML = `
      <div class="speaker-name" style="color:var(--success);">Миссия выполнена!</div>
      <div class="dialogue-text">Отступник повержен! Дорога в Страну Чая свободна.<br>Награда: <b>+1,000 Рё</b>, рост доверия деревни.</div>
      <button class="primary-btn" onclick="sceneKonohaHub()">Вернуться с триумфом в Коноху</button>
    `;
  } else {
    renderCombatTurn(lastActionLog);
  }
}

// Старт с пролога
scenePrologue();
</script>
</body>
</html>
