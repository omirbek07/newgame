<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shinobi Chronicles</title>
  <style>
    :root {
      --bg: #0b0e14;
      --panel-bg: rgba(15, 20, 30, 0.95);
      --accent: #f39c12;
      --text: #f0f6fc;
      --subtext: #8b949e;
      --danger: #e74c3c;
      --success: #2ecc71;
      --blue: #3498db;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: var(--text); }
    
    #app-container {
      width: 100%; max-width: 420px; height: 100vh; max-height: 860px;
      background: var(--bg); display: flex; flex-direction: column;
      border: 1px solid #30363d; border-radius: 12px; overflow: hidden; position: relative;
    }

    /* АНИМЕ СЦЕНА */
    #visual-stage {
      height: 54%; width: 100%; position: relative;
      background-size: cover; background-position: center;
      display: flex; justify-content: center; align-items: flex-end;
      overflow: hidden; border-bottom: 2px solid #2a3346;
      background-color: #1a1e29;
      transition: background-image 0.3s ease-in-out;
    }

    #char-sprite {
      max-height: 95%; max-width: 85%; object-fit: contain;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.8));
      transition: transform 0.2s ease, filter 0.2s ease;
      user-select: none;
    }

    /* ЭФФЕКТЫ УРОНА */
    .shake { animation: shakeAnim 0.3s ease-in-out; }
    @keyframes shakeAnim {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-8px, 4px); }
      50% { transform: translate(8px, -4px); }
      75% { transform: translate(-4px, 2px); }
    }
    .hit-flash { filter: brightness(2.5) drop-shadow(0 0 12px red) !important; }

    /* НИЖНЯЯ ПАНЕЛЬ ДИАЛОГОВ / ДЕЙСТВИЙ */
    #control-panel {
      height: 46%; display: flex; flex-direction: column;
      padding: 12px; background: var(--panel-bg); gap: 8px; overflow-y: auto;
    }

    .speaker-name {
      font-size: 13px; font-weight: bold; color: var(--accent);
      text-transform: uppercase; letter-spacing: 1px;
    }
    .dialogue-text { font-size: 13.5px; line-height: 1.45; color: var(--text); flex-grow: 1; }

    .choice-btn {
      width: 100%; padding: 10px 12px; background: #1c2333; border: 1px solid #374461;
      border-radius: 8px; color: var(--text); text-align: left; font-size: 13px;
      cursor: pointer; transition: 0.15s;
    }
    .choice-btn:active { background: #2a354d; border-color: var(--accent); }

    .primary-btn {
      width: 100%; padding: 11px; background: var(--accent); border: none;
      border-radius: 8px; color: #0d1117; font-size: 13.5px; font-weight: bold; cursor: pointer;
    }

    /* БОЕВОЙ ИНТЕРФЕЙС */
    .battle-hud { position: absolute; top: 10px; width: 92%; display: flex; justify-content: space-between; gap: 10px; z-index: 10; }
    .hud-box { background: rgba(13, 17, 23, 0.85); backdrop-filter: blur(4px); padding: 6px 10px; border-radius: 6px; border: 1px solid #30363d; flex: 1; font-size: 11px; }
    .hp-bar-bg { width: 100%; background: #21262d; height: 7px; border-radius: 4px; overflow: hidden; margin-top: 3px; }
    .hp-bar-fill { height: 100%; background: var(--success); transition: width 0.3s ease; }
    .combat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  </style>
</head>
<body>

<div id="app-container">
  <!-- ВЕРХ: ФОН + ПЕРСОНАЖ -->
  <div id="visual-stage">
    <div class="battle-hud" id="battle-hud" style="display:none;">
      <div class="hud-box">
        <span id="player-hud-name">Шиноби</span>
        <div class="hp-bar-bg"><div class="hp-bar-fill" id="p-hp-bar"></div></div>
      </div>
      <div class="hud-box" style="text-align:right;">
        <span id="enemy-hud-name" style="color:var(--danger);">Нукэнин</span>
        <div class="hp-bar-bg"><div class="hp-bar-fill" id="e-hp-bar" style="background:var(--danger); float:right;"></div></div>
      </div>
    </div>
    <img id="char-sprite" src="" alt="character" style="display:none;">
  </div>

  <!-- НИЗ: ДИАЛОГ И КНОПКИ -->
  <div id="control-panel"></div>
</div>

<script>
// ==========================================
// 🎨 НАСТОЯЩИЕ КАРТИНКИ ИЗ ВСЕЛЕННОЙ НАРУТО
// Ты можешь заменить любую из этих ссылок на свою собственную!
// ==========================================
const ASSETS = {
  bg: {
    // Класс Академии
    academy: "https://images-wixmp-ed30a86b8c4ca887773594c2.wixmp.com/f/3c8b4c05-ea78-4395-83e9-74e9e431f90e/de7v7y1-6bcefc2f-90e6-42bb-954f-124b17f53da5.jpg?token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9",
    // Деревня Коноха со скалой Хокаге
    konoha: "https://images-wixmp-ed30a86b8c4ca887773594c2.wixmp.com/f/d9ff6ebf-a185-48b6-9df3-9e5884ae72bb/de7v89b-8ec64df2-70b9-43c3-b0eb-8f5539df8b1a.jpg?token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9",
    // Лес Страны Огня для боев
    forest: "https://images-wixmp-ed30a86b8c4ca887773594c2.wixmp.com/f/3c8b4c05-ea78-4395-83e9-74e9e431f90e/de7v7vd-df6a4ae0-a249-411a-bdcf-b0d59299b9cf.jpg?token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9"
  },
  sprites: {
    // Каноничные прозрачные PNG рендеры героев
    iruka: "https://freepngimg.com/thumb/naruto/103131-iruka-naruto-free-download-png-hd.png",
    naruto: "https://freepngimg.com/thumb/naruto/8-2-naruto-png-picture.png",
    sasuke: "https://freepngimg.com/thumb/naruto/102985-sasuke-naruto-free-download-png-hd.png",
    hinata: "https://freepngimg.com/thumb/naruto/102924-hinata-naruto-free-download-png-hd.png",
    enemy: "https://freepngimg.com/thumb/naruto/103157-ninja-naruto-free-download-png-hd.png"
  }
};

const state = {
  name: "Рэн",
  clan: "Узумаки",
  element: "Огонь",
  relations: { naruto: 10, sasuke: 5, hinata: 15 },
  selectedPartner: "naruto",
  ryo: 500
};

let combat = null;

const stage = document.getElementById("visual-stage");
const sprite = document.getElementById("char-sprite");
const panel = document.getElementById("control-panel");
const battleHud = document.getElementById("battle-hud");

function setScene(bgUrl, spriteUrl = null) {
  stage.style.backgroundImage = `url('${bgUrl}')`;
  if (spriteUrl) {
    sprite.src = spriteUrl;
    sprite.style.display = "block";
  } else {
    sprite.style.display = "none";
  }
}

// 1. ВРУЧЕНИЕ ПРОТЕКТОРА ИРУКОЙ
function scenePrologue() {
  battleHud.style.display = "none";
  setScene(ASSETS.bg.academy, ASSETS.sprites.iruka);

  panel.innerHTML = `
    <div class="speaker-name">Ирука Умино</div>
    <div class="dialogue-text">
      «Поздравляю с выпуском, ${state.name}! Ты сдал финальный экзамен по клонированию. С сегодняшнего дня ты — шиноби Конохи! Выходи в коридор, скоро назовут составы команд.»
    </div>
    <button class="primary-btn" onclick="sceneHallway()">Выйти в коридор Академии →</button>
  `;
}

// 2. ВЫБОР ДИАЛОГА В КОРИДОРЕ
function sceneHallway() {
  setScene(ASSETS.bg.academy, null);
  panel.innerHTML = `
    <div class="speaker-name">Коридор выпускников</div>
    <div class="dialogue-text">Все празднуют получение протекторов. К кому ты хочешь подойти поговорить?</div>
    <button class="choice-btn" onclick="talkNaruto()">🍜 Подойти к Наруто</button>
    <button class="choice-btn" onclick="talkSasuke()">⚡ Подойти к Саске</button>
    <button class="choice-btn" onclick="talkHinata()">🌸 Подойти к Хинате</button>
  `;
}

function talkNaruto() {
  setScene(ASSETS.bg.academy, ASSETS.sprites.naruto);
  panel.innerHTML = `
    <div class="speaker-name">Наруто Узумаки</div>
    <div class="dialogue-text">«Хэй, ${state.name}! Видал мой протектор?! Теперь я шиноби! Спорим, я стану Хокаге быстрее всех вас?!»</div>
    <button class="choice-btn" onclick="state.relations.naruto+=10; sceneKonohaHub();">
      «Я верю в тебя, Наруто! Покажем всем класс!» (+10 дружбы)
    </button>
  `;
}

function talkSasuke() {
  setScene(ASSETS.bg.academy, ASSETS.sprites.sasuke);
  panel.innerHTML = `
    <div class="speaker-name">Саске Учиха</div>
    <div class="dialogue-text">«Повязка в стенах школы ничего не стоит. Настоящий отбор начнется на первой же миссии.»</div>
    <button class="choice-btn" onclick="state.relations.sasuke+=10; sceneKonohaHub();">
      «Посмотрим в первом же спарринге, Саске.» (+10 уважения)
    </button>
  `;
}

function talkHinata() {
  setScene(ASSETS.bg.academy, ASSETS.sprites.hinata);
  panel.innerHTML = `
    <div class="speaker-name">Хината Хьюга</div>
    <div class="dialogue-text">«А... эм... ${state.name}... Поздравляю с выпуском... Твой контроль чакры был очень впечатляющим...»</div>
    <button class="choice-btn" onclick="state.relations.hinata+=15; sceneKonohaHub();">
      «Спасибо, Хината! Твой Мягкий кулак тоже лучший.» (+15 симпатии)
    </button>
  `;
}

// 3. ХАБ КОНОХИ
function sceneKonohaHub() {
  battleHud.style.display = "none";
  setScene(ASSETS.bg.konoha, null);

  panel.innerHTML = `
    <div class="speaker-name">Деревня Скрытого Листа (Хаб)</div>
    <div class="dialogue-text">
      Ты на улицах деревни. В кошельке: <b>${state.ryo} Рё</b>.<br>
      Связи: 🍜 Наруто (${state.relations.naruto}) | ⚡ Саске (${state.relations.sasuke}) | 🌸 Хината (${state.relations.hinata})
    </div>

    <div style="font-size:11px; color:var(--subtext); margin-bottom:4px;">Выбери напарника на вылазку:</div>
    <div style="display:flex; gap:6px;">
      <button class="choice-btn" style="text-align:center;" onclick="state.selectedPartner='naruto'; alert('Выбран Наруто!');">Наруто</button>
      <button class="choice-btn" style="text-align:center;" onclick="state.selectedPartner='sasuke'; alert('Выбран Саске!');">Саске</button>
      <button class="choice-btn" style="text-align:center;" onclick="state.selectedPartner='hinata'; alert('Выбрана Хината!');">Хината</button>
    </div>

    <button class="primary-btn" style="margin-top:auto;" onclick="startCombatScene()">
      ⚔️ Начать боевую миссию ранга C (Засада в лесу) →
    </button>
  `;
}

// 4. БОЙ В ЛЕСУ
function startCombatScene() {
  combat = {
    turn: 1,
    pHp: 75, pMaxHp: 75,
    pChakra: 70, pMaxChakra: 70,
    ap: 3,
    eHp: 65, eMaxHp: 65,
    kawarimi: false
  };

  battleHud.style.display = "flex";
  document.getElementById("player-hud-name").innerText = state.name;
  setScene(ASSETS.bg.forest, ASSETS.sprites.enemy);
  renderCombatTurn();
}

function updateHudBars() {
  const pPct = Math.max(0, Math.round((combat.pHp / combat.pMaxHp) * 100));
  const ePct = Math.max(0, Math.round((combat.eHp / combat.eMaxHp) * 100));
  document.getElementById("p-hp-bar").style.width = pPct + "%";
  document.getElementById("e-hp-bar").style.width = ePct + "%";
}

function triggerHitAnimation() {
  sprite.classList.add("shake", "hit-flash");
  stage.classList.add("shake");
  setTimeout(() => {
    sprite.classList.remove("shake", "hit-flash");
    stage.classList.remove("shake");
  }, 350);
}

function renderCombatTurn(message = "Твой ход! Выбери действие:") {
  updateHudBars();
  panel.innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span class="speaker-name">Раунд ${combat.turn}</span>
      <span style="font-size:12px; font-weight:bold; color:var(--accent);">⚡ ОД: ${combat.ap} | 🌀 Чакра: ${combat.pChakra}</span>
    </div>
    <div class="dialogue-text" style="font-size:12px; margin: 4px 0;">${message}</div>

    <div class="combat-grid">
      <button class="choice-btn" onclick="combatAttack()" ${combat.ap < 1 ? 'disabled':''}>
        🗡️️ Бросок куная<br><small>1 ОД (+8 чакры)</small>
      </button>

      <button class="choice-btn" onclick="combatJutsu()" ${combat.ap < 2 || combat.pChakra < 25 ? 'disabled':''}>
        🔥 Стихия Огня<br><small>2 ОД (25 чакры)</small>
      </button>

      <button class="choice-btn" onclick="combatKawarimi()" ${combat.ap < 1 || combat.kawarimi ? 'disabled':''}>
        🪵 Замещение<br><small>1 ОД (Щит 80%)</small>
      </button>

      <button class="choice-btn" onclick="combatPartner()" ${combat.ap < 2 ? 'disabled':''}>
        👥 Атака напарника<br><small>2 ОД [${state.selectedPartner.toUpperCase()}]</small>
      </button>
    </div>

    <button class="choice-btn" style="text-align:center; background:#161b22; margin-top:2px;" onclick="enemyTurn()">
      ⌛ Завершить ход
    </button>
  `;
}

function combatAttack() {
  combat.ap -= 1;
  const dmg = 12;
  combat.eHp -= dmg;
  combat.pChakra = Math.min(combat.pMaxChakra, combat.pChakra + 8);
  triggerHitAnimation();
  checkBattle("🗡️ Меткий бросок куная: -" + dmg + " HP врагу!");
}

function combatJutsu() {
  combat.ap -= 2;
  combat.pChakra -= 25;
  const dmg = 24;
  combat.eHp -= dmg;
  triggerHitAnimation();
  checkBattle("🔥 Стихийный огненный шар сжигает защиту: -" + dmg + " HP!");
}

function combatKawarimi() {
  combat.ap -= 1;
  combat.kawarimi = true;
  renderCombatTurn("🪵 Подготовлена замена на бревно.");
}

function combatPartner() {
  combat.ap -= 2;
  const dmg = 18;
  combat.eHp -= dmg;
  triggerHitAnimation();
  checkBattle(`👥 Напарник ${state.selectedPartner.toUpperCase()} внезапно ворвался в бой: -${dmg} HP врагу!`);
}

function enemyTurn() {
  let dmg = 16;
  let log = "";
  if (combat.kawarimi) {
    dmg = 3;
    combat.kawarimi = false;
    log = "🪵 Враг рассек бревно подмены! Ты получил всего 3 урона.";
  } else {
    log = `💥 Нукэнин атакует клинком ветра: -${dmg} HP!`;
  }

  stage.classList.add("shake");
  setTimeout(() => stage.classList.remove("shake"), 300);

  combat.pHp -= dmg;
  combat.turn++;
  combat.ap = 3;

  if (combat.pHp <= 0) {
    battleHud.style.display = "none";
    panel.innerHTML = `
      <div class="speaker-name" style="color:var(--danger);">Поражение</div>
      <div class="dialogue-text">Ты потерял сознание. Напарник успел оттащить тебя обратно в Коноху.</div>
      <button class="primary-btn" onclick="sceneKonohaHub()">Очнуться в палате Конохи</button>
    `;
    return;
  }

  renderCombatTurn(log);
}

function checkBattle(lastActionLog) {
  if (combat.eHp <= 0) {
    battleHud.style.display = "none";
    sprite.style.display = "none";
    state.ryo += 1000;
    panel.innerHTML = `
      <div class="speaker-name" style="color:var(--success);">Победа на миссии!</div>
      <div class="dialogue-text">Отступник повержен! Торговый караван спасен.<br>Награда: <b>+1,000 Рё</b>, +15 к связи с напарником.</div>
      <button class="primary-btn" onclick="sceneKonohaHub()">Вернуться в Коноху</button>
    `;
  } else {
    renderCombatTurn(lastActionLog);
  }
}

// Старт игры
scenePrologue();
</script>
</body>
</html>
